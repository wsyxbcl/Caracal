[package]
name = "web-rde"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
# std hashing + serde_json's preserve_order (indexmap) need a wasm RNG backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
rde-core = { path = "../crates/rde-core" }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
