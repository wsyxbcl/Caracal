[package]
name = "serval-charton-web"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
charton = "0.5.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
polars = { version = "0.49", default-features = false }
polars-io = { version = "0.49", default-features = false, features = ["csv"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
